[package]
name = "nicotaurix-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
local-ip-address = "0.6"
qrcode = "0.14"
futures-util = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.24"
