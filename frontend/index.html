<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000" />
    <title>NicoTauriX</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        --bar-h: 42px;
        --bg: #0d0d0d;
        --surface: #181818;
        --border: #2a2a2a;
        --text: #e0e0e0;
        --text-dim: #777;
        --accent: #1d9bf0;
        --accent-hover: #1a8cd8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: var(--bar-h);
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }

      /* ── Navigation Bar ── */
      #navbar {
        display: flex;
        align-items: center;
        height: var(--bar-h);
        padding: 0 6px;
        gap: 4px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }

      /* Nav buttons */
      .nav-btn {
        width: 28px; height: 28px;
        display: flex; align-items: center; justify-content: center;
        background: none; border: none; color: var(--text-dim);
        border-radius: 6px; cursor: pointer; font-size: 16px;
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .nav-btn:hover { background: var(--surface); color: var(--text); }
      .nav-btn:active { transform: scale(0.92); }

      /* URL bar */
      #url-bar {
        flex: 1;
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        color: var(--text);
        font-size: 12.5px;
        outline: none;
        transition: border-color 0.2s, background 0.2s;
        min-width: 0;
      }
      #url-bar:focus {
        border-color: var(--accent);
        background: #111;
        -webkit-user-select: text;
        user-select: text;
      }

      /* Danmaku indicator (pill) */
      #danmaku-pill {
        display: flex; align-items: center; gap: 4px;
        height: 28px; padding: 0 10px;
        border-radius: 14px;
        background: var(--accent);
        color: #fff;
        font-size: 11px; font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
        flex-shrink: 0;
      }
      #danmaku-pill:hover { background: var(--accent-hover); }
      #danmaku-pill.off {
        background: var(--surface);
        color: var(--text-dim);
        border: 1px solid var(--border);
      }

      /* WS status dot */
      #ws-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #f87171;
        flex-shrink: 0;
        transition: background 0.3s;
      }
      #ws-dot.connected { background: #4ade80; }

      /* ── Settings Panel (gear popup) ── */
      #settings-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 1000;
      }
      #settings-overlay.show { display: block; }

      #settings-panel {
        position: fixed;
        top: var(--bar-h);
        right: 8px;
        width: 260px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        z-index: 1001;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      }
      .settings-title {
        font-size: 13px; font-weight: 700;
        margin-bottom: 14px;
        color: var(--text);
      }
      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .setting-row:last-child { margin-bottom: 0; }
      .setting-label {
        font-size: 12px;
        color: var(--text-dim);
      }
      .setting-value {
        font-size: 12px;
        color: var(--text);
        min-width: 20px;
        text-align: right;
      }
      #settings-panel input[type="range"] {
        width: 120px;
        accent-color: var(--accent);
      }
      #settings-panel input[type="color"] {
        width: 28px; height: 28px;
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
        padding: 0;
        background: none;
      }
      .settings-btn {
        width: 100%;
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
        transition: all 0.15s;
        margin-top: 4px;
      }
      .settings-btn:hover { background: #222; }
      .settings-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .settings-btn.primary:hover { background: var(--accent-hover); }
      .settings-divider {
        height: 1px;
        background: var(--border);
        margin: 12px 0;
      }

      /* ── QR Modal ── */
      #qr-modal {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.85);
        z-index: 2000;
        align-items: center; justify-content: center;
        flex-direction: column;
      }
      #qr-modal.show { display: flex; }
      #qr-container {
        background: #fff;
        padding: 28px;
        border-radius: 16px;
        text-align: center;
      }
      #qr-container svg { width: 220px; height: 220px; }
      #qr-url {
        margin-top: 12px;
        font-size: 13px;
        color: #555;
        word-break: break-all;
      }
      #qr-close {
        margin-top: 16px;
        padding: 8px 28px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <nav id="navbar">
      <button class="nav-btn" id="btn-back" title="戻る">&#9664;</button>
      <button class="nav-btn" id="btn-forward" title="進む">&#9654;</button>
      <button class="nav-btn" id="btn-reload" title="再読み込み">&#8635;</button>

      <input type="text" id="url-bar" value="https://x.com" placeholder="URLを入力" spellcheck="false" autocomplete="off" />

      <div id="danmaku-pill" title="弾幕 ON/OFF">
        <span id="danmaku-label">弾幕</span>
      </div>

      <span id="ws-dot" title="WebSocket"></span>

      <button class="nav-btn" id="btn-settings" title="設定">&#9881;</button>
    </nav>

    <!-- Settings dropdown -->
    <div id="settings-overlay">
      <div id="settings-panel">
        <div class="settings-title">弾幕設定</div>

        <div class="setting-row">
          <span class="setting-label">速度</span>
          <input type="range" id="speed-slider" min="1" max="5" value="3" />
          <span class="setting-value" id="speed-value">3</span>
        </div>

        <div class="setting-row">
          <span class="setting-label">フォントサイズ</span>
          <input type="range" id="fontsize-slider" min="16" max="48" value="28" />
          <span class="setting-value" id="fontsize-value">28</span>
        </div>

        <div class="setting-row">
          <span class="setting-label">デフォルト色</span>
          <input type="color" id="color-picker" value="#FFFFFF" />
        </div>

        <div class="settings-divider"></div>

        <button class="settings-btn" id="btn-inject">弾幕スクリプトを再注入</button>
        <button class="settings-btn primary" id="btn-qr">QRコードで共有</button>
      </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal">
      <div id="qr-container">
        <div id="qr-svg"></div>
        <div id="qr-url"></div>
      </div>
      <button id="qr-close">閉じる</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
