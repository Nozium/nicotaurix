<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1da1f2" />
    <title>NicoTauriX - ニコニコXブラウザ</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Hiragino Sans", "MS Gothic", sans-serif;
        background: #0a0a0a;
        color: #ffffff;
        min-height: 100vh;
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        background: #111;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #333;
        z-index: 10;
      }
      header h1 {
        font-size: 18px;
        font-weight: bold;
      }
      .status {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 12px;
        background: #333;
      }
      .status.connected {
        background: #1a472a;
        color: #4ade80;
      }
      .status.disconnected {
        background: #472a1a;
        color: #f87171;
      }
      #danmaku-area {
        flex: 1;
        position: relative;
        background: #000;
      }
      #danmaku-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #controls {
        background: #111;
        padding: 12px 16px;
        border-top: 1px solid #333;
        z-index: 10;
      }
      .control-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      .control-row:last-child {
        margin-bottom: 0;
      }
      label {
        font-size: 13px;
        min-width: 50px;
        color: #aaa;
      }
      input[type="range"] {
        flex: 1;
        accent-color: #1da1f2;
      }
      input[type="color"] {
        width: 36px;
        height: 28px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .toggle-btn {
        padding: 6px 16px;
        border: 1px solid #555;
        border-radius: 6px;
        background: #222;
        color: #fff;
        cursor: pointer;
        font-size: 13px;
      }
      .toggle-btn.active {
        background: #1da1f2;
        border-color: #1da1f2;
      }
      #qr-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 100;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      #qr-modal.show {
        display: flex;
      }
      #qr-container {
        background: #fff;
        padding: 24px;
        border-radius: 12px;
        text-align: center;
      }
      #qr-container svg {
        width: 240px;
        height: 240px;
      }
      #qr-url {
        margin-top: 12px;
        font-size: 14px;
        color: #333;
        word-break: break-all;
      }
      #qr-close {
        margin-top: 16px;
        padding: 8px 24px;
        background: #1da1f2;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }
      #qr-btn {
        background: none;
        border: 1px solid #555;
        color: #fff;
        padding: 4px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>NicoTauriX</h1>
        <div style="display: flex; gap: 8px; align-items: center">
          <button id="qr-btn">QR</button>
          <span id="connection-status" class="status disconnected"
            >Disconnected</span
          >
        </div>
      </header>

      <div id="danmaku-area">
        <canvas id="danmaku-canvas"></canvas>
      </div>

      <div id="controls">
        <div class="control-row">
          <label>Speed</label>
          <input type="range" id="speed-slider" min="1" max="5" value="3" />
          <span id="speed-value">3</span>
        </div>
        <div class="control-row">
          <label>Color</label>
          <input type="color" id="color-picker" value="#FFFFFF" />
          <button id="toggle-btn" class="toggle-btn active">ON</button>
        </div>
      </div>

      <div id="qr-modal">
        <div id="qr-container">
          <div id="qr-svg"></div>
          <div id="qr-url"></div>
        </div>
        <button id="qr-close">Close</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
